name: Apply database migrations

# Manual only. Applies supabase/migrations/*.sql to the dedicated Solvant project (all objects live in schema `solvant`).
# Order: rehearsal on a throwaway local Postgres -> READ-ONLY preflight against the target (rejects the wrong project,
# a foreign `solvant` schema, unexpected objects, newer ledger versions, pg_trgm elsewhere) -> apply ALL files in ONE
# transaction (any error rolls everything back). Needs repository secret SUPABASE_DB_URL (Session pooler connection
# string: postgresql://postgres.<project ref>:<password>@<region>.pooler.supabase.com:5432/postgres). Its format is
# validated before any connection; the connection string is never printed. Logs contain no lead data.
# Run only after PR review + merge and after confirming a backup/restore point exists (see docs/platform/README.md).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type APPLY to apply the migrations to project dfnaevcsergsphiiodtm"
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: apply-database-migrations
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash          # GitHub runs this as: bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Confirm
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = "APPLY" ] || { echo "::error::Type APPLY to confirm"; exit 1; }

      - name: Validate the connection string format (no network; credentials never printed)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_DB_URL:-}" ] || { echo "::error::Secret SUPABASE_DB_URL is not set"; exit 1; }
          echo "::add-mask::$SUPABASE_DB_URL"
          python3 supabase/scripts/preflight.py --expect-ref dfnaevcsergsphiiodtm --check-uri-only

      - name: Rehearse on a local Postgres (must pass first)
        run: |
          set -euo pipefail
          bash supabase/tests/run_local.sh

      - name: Read-only preflight against the target (must report VERDICT OK)
        id: preflight
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SUPABASE_DB_URL"
          rc=0
          python3 supabase/scripts/preflight.py --expect-ref dfnaevcsergsphiiodtm > "$RUNNER_TEMP/preflight.txt" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/preflight.txt"
          { echo '```'; cat "$RUNNER_TEMP/preflight.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then echo "::error::Preflight failed (exit $rc): migrations NOT applied"; exit "$rc"; fi

      - name: Apply all migrations in one transaction
        if: success() && steps.preflight.outcome == 'success'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SUPABASE_DB_URL"
          cat supabase/migrations/*.sql > "$RUNNER_TEMP/all.sql"
          PGOPTIONS="-c client_min_messages=warning" psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -q -1 -f "$RUNNER_TEMP/all.sql" > /dev/null
          psql "$SUPABASE_DB_URL" -X -At -c "select 'ledger: ' || string_agg(version, ', ' order by version) from solvant.schema_migrations"
          psql "$SUPABASE_DB_URL" -X -At -c "select count(*) || ' sources seeded' from solvant.sources"

      - name: Post-apply preflight (expects this app's own schema, no foreign objects)
        if: success() && steps.preflight.outcome == 'success'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SUPABASE_DB_URL"
          rc=0
          python3 supabase/scripts/preflight.py --expect-ref dfnaevcsergsphiiodtm > "$RUNNER_TEMP/postflight.txt" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/postflight.txt"
          { echo '```'; cat "$RUNNER_TEMP/postflight.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
