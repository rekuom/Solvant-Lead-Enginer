name: Multi-source discovery

# Discovery for the Solvant platform. Permitted sources only (registry-gated). No outreach.
# - Manual runs: any permitted source; Brave only when explicitly ticked AND a key exists (hard cap 100).
# - Which sources run is decided by the administrator's source settings in the private database (Sources page), combined
#   with the engine's legal gates (signal_engine.discovery.platform.plan). A dashboard toggle can never override source terms.
# - Scheduled runs: OFF unless the repository variable DISCOVERY_SCHEDULE_ENABLED == 'true'. Evaluated hourly; each source
#   runs only when enabled, permitted and its own schedule is due. If the plan cannot be fetched, NOTHING is collected.
#   Paid sources (Brave) are never run on a schedule.
# - Records go to the PRIVATE Supabase database via a hashed ingest token (secret SIGNAL_INGEST_TOKEN); public outputs
#   are redacted, counts-only for Brave, and published only after the privacy gate passes.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "auto = use the Sources page settings (recommended). Or an explicit list: github_issues, github_discussions, procurement, feeds, search:brave"
        required: false
        default: "auto"
      since_days:
        description: "Look-back window (1-90 days)"
        required: false
        default: "45"
      max_requests:
        description: "Max API requests per connector (1-30)"
        required: false
        default: "20"
      include_discussions:
        description: "Also search GitHub Discussions (GraphQL with the job token)"
        type: boolean
        default: true
      allow_restricted:
        description: "Restricted sources you have reviewed and explicitly allow for THIS run (e.g. hn_algolia). Leave empty if unsure."
        required: false
        default: ""
      dry_run:
        description: "Plan only: no requests at all"
        type: boolean
        default: false
      enable_brave:
        description: "Allow LIVE Brave Search requests (needs the BRAVE_SEARCH_API_KEY secret). Off = plan + cost estimate only"
        type: boolean
        default: false
      brave_max_requests:
        description: "Brave request cap for this run (1-100; hard cap 100)"
        required: false
        default: "100"
      brave_freshness:
        description: "Brave freshness: pd (24h), pw (7d), pm (31d), py (1y)"
        required: false
        default: "pm"
      brave_retention_permitted:
        description: "Request retention. Has NO effect unless the repo VARIABLE BRAVE_STORAGE_RIGHTS_ATTESTATION is set; even then snippets stay private (never uploaded)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: multi-source-discovery
  cancel-in-progress: false

jobs:
  discover:
    if: github.event_name != 'schedule' || vars.DISCOVERY_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate inputs
        id: in
        env:
          IN_SOURCES: ${{ inputs.sources || 'auto' }}
          IN_DAYS: ${{ inputs.since_days || '3' }}
          IN_MAX: ${{ inputs.max_requests || '20' }}
          IN_ALLOW: ${{ inputs.allow_restricted || '' }}
          IN_BMAX: ${{ inputs.brave_max_requests || '100' }}
          IN_BFRESH: ${{ inputs.brave_freshness || 'pm' }}
        run: |
          [[ "$IN_SOURCES" =~ ^[a-z_:,]+$ ]] || { echo "invalid sources"; exit 1; }
          [[ -z "$IN_ALLOW" || "$IN_ALLOW" =~ ^[a-z_,]+$ ]] || { echo "invalid allow_restricted"; exit 1; }
          [[ "$IN_DAYS" =~ ^[0-9]+$ && "$IN_DAYS" -ge 1 && "$IN_DAYS" -le 90 ]] || { echo "since_days 1-90"; exit 1; }
          [[ "$IN_MAX" =~ ^[0-9]+$ && "$IN_MAX" -ge 1 && "$IN_MAX" -le 30 ]] || { echo "max_requests 1-30"; exit 1; }
          [[ "$IN_BMAX" =~ ^[0-9]+$ && "$IN_BMAX" -ge 1 && "$IN_BMAX" -le 100 ]] || { echo "brave_max_requests 1-100"; exit 1; }
          [[ "$IN_BFRESH" =~ ^(pd|pw|pm|py)$ ]] || { echo "brave_freshness must be pd/pw/pm/py"; exit 1; }
          { echo "sources=$IN_SOURCES"; echo "days=$IN_DAYS"; echo "max=$IN_MAX"; echo "allow=$IN_ALLOW";
            echo "bmax=$IN_BMAX"; echo "bfresh=$IN_BFRESH"; } >> "$GITHUB_OUTPUT"

      - name: Collector plan from the Sources page settings (reasons only; no secrets)
        id: plan
        working-directory: poc
        env:
          SIGNAL_INGEST_TOKEN: ${{ secrets.SIGNAL_INGEST_TOKEN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          BRAVE_SEARCH_API_KEY_PRESENT: ${{ secrets.BRAVE_SEARCH_API_KEY != '' && 'yes' || '' }}
          MODE: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
        run: |
          python -m signal_engine.discovery.platform.plan --mode "$MODE" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Resolve what runs
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          IN_SOURCES: ${{ steps.in.outputs.sources }}
          PLAN_ACTIVE: ${{ steps.plan.outputs.active }}
          PLAN_SOURCES: ${{ steps.plan.outputs.sources }}
          PLAN_ALLOW: ${{ steps.plan.outputs.allow_restricted }}
          PLAN_MAX: ${{ steps.plan.outputs.max_requests }}
          IN_ALLOW: ${{ steps.in.outputs.allow }}
          IN_MAX: ${{ steps.in.outputs.max }}
        run: |
          if [ "$EVENT" = "schedule" ] || [ "$IN_SOURCES" = "auto" ]; then
            if [ "$PLAN_ACTIVE" != "true" ]; then
              if [ "$EVENT" = "schedule" ]; then echo "Central source control is not active: nothing collected."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
              echo "::error::Central source control is not active (see the plan step). Choose sources explicitly or connect the database."; exit 1
            fi
            [ -n "$PLAN_SOURCES" ] || { echo "No source is due/eligible."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }
            { echo "run=true"; echo "sources=$PLAN_SOURCES"; echo "allow=$PLAN_ALLOW"; echo "max=$PLAN_MAX"; echo "origin=plan"; } >> "$GITHUB_OUTPUT"
          else
            { echo "run=true"; echo "sources=$IN_SOURCES"; echo "allow=$IN_ALLOW"; echo "max=$IN_MAX"; echo "origin=explicit"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Unit + regression tests (must pass before any collection)
        if: steps.resolve.outputs.run == 'true'
        working-directory: poc
        run: python -m unittest discover -s tests

      - name: Source permission registry
        working-directory: poc
        run: |
          echo "## Source registry" >> "$GITHUB_STEP_SUMMARY"
          python -m signal_engine.discovery.run sources >> "$GITHUB_STEP_SUMMARY"

      - name: Restore query log (repeat prevention across runs; contains query ids and counts only)
        uses: actions/cache@v4
        with:
          path: poc/out/discovery/query_log.json
          key: discovery-querylog-${{ github.run_id }}
          restore-keys: discovery-querylog-

      - name: Discover (permitted sources only)
        id: disc
        if: steps.resolve.outputs.run == 'true'
        working-directory: poc
        env:
          GITHUB_TOKEN: ${{ github.token }}     # read-only job token: raises GitHub search limits, enables Discussions GraphQL
          SOURCES: ${{ steps.resolve.outputs.sources }}
          DAYS: ${{ steps.in.outputs.days }}
          MAX: ${{ steps.resolve.outputs.max }}
          ALLOW: ${{ steps.resolve.outputs.allow }}
          DISC: ${{ steps.resolve.outputs.origin == 'explicit' && inputs.include_discussions && '--include-discussions' || '' }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
          BRAVE: ${{ github.event_name == 'workflow_dispatch' && (steps.resolve.outputs.origin == 'plan' && steps.plan.outputs.enable_brave == 'true' || steps.resolve.outputs.origin == 'explicit' && inputs.enable_brave) && '--enable-brave' || '' }}
          BMAX: ${{ steps.resolve.outputs.origin == 'plan' && steps.plan.outputs.brave_max_requests || steps.in.outputs.bmax }}
          BFRESH: ${{ steps.in.outputs.bfresh }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}   # never logged; absent = Brave stays off
          RETAIN: ${{ inputs.brave_retention_permitted && '--brave-retention-permitted' || '' }}
          # Operator-configured attestation (Settings > Variables), format plan=..;confirmed_by=..;date=YYYY-MM-DD. Not a run input.
          BRAVE_STORAGE_RIGHTS_ATTESTATION: ${{ vars.BRAVE_STORAGE_RIGHTS_ATTESTATION }}
        run: |
          set +e
          python -m signal_engine.discovery.run discover --sources "$SOURCES" --since-days "$DAYS" --max-requests "$MAX" \
            --max-queries 40 --allow-restricted "$ALLOW" $DISC $DRY $BRAVE $RETAIN --brave-max-requests "$BMAX" --brave-freshness "$BFRESH"
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Assess, route, rank (redacted public report)
        id: report
        if: always() && steps.resolve.outputs.run == 'true'   # still runs after a collector failure so safe diagnostics can be published
        working-directory: poc
        run: python -m signal_engine.discovery.run report --shortlist 20 > /dev/null

      - name: Push to the private platform database (counts-only log; skipped if not configured)
        id: push
        if: always() && steps.report.outcome == 'success'
        working-directory: poc
        env:
          SIGNAL_INGEST_TOKEN: ${{ secrets.SIGNAL_INGEST_TOKEN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: python -m signal_engine.discovery.platform.push

      # FAIL-CLOSED: nothing from out/discovery reaches the job summary or an artifact unless the report step
      # succeeded AND this gate passed (all public files present, no Brave output, no e-mail/phone, counts-only audit).
      - name: Public-artifact privacy gate (no Brave output, no e-mail addresses)
        id: privacy
        if: always() && steps.report.outcome == 'success'
        working-directory: poc
        run: python scripts/policy_check.py --artifacts out/discovery --require-all

      - name: Publish redacted report to the job summary (only after the privacy gate passed)
        if: always() && steps.report.outcome == 'success' && steps.privacy.outcome == 'success'
        working-directory: poc
        run: cat out/discovery/report_public.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload REDACTED outputs only (only after the privacy gate passed)
        id: upload
        if: always() && steps.report.outcome == 'success' && steps.privacy.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: discovery-${{ github.run_id }}
          path: |
            poc/out/discovery/report_public.md
            poc/out/discovery/report_public.csv
            poc/out/discovery/report_public.jsonl
            poc/out/discovery/stage_audit.json
            poc/out/discovery/run_log.json
          retention-days: 30
          if-no-files-found: error

      - name: Fail if the privacy gate did not pass (artifacts withheld)
        if: always() && steps.resolve.outputs.run == 'true' && steps.privacy.outcome != 'success'
        run: |
          echo "::error::Report generation or the public-artifact privacy gate did not succeed: no summary and no artifact were published"; exit 1

      - name: Fail if any enabled connector failed (never hide failures behind green)
        if: always() && steps.resolve.outputs.run == 'true'
        env:
          DISC_EXIT: ${{ steps.disc.outputs.exit }}
        run: |
          if [ "$DISC_EXIT" != "0" ]; then
            echo "::error::One or more connectors failed or partially failed — see run_log.json"; exit 1; fi
